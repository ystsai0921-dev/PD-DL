version: '3.8'

services:
  pd-downloader:
    build: .
    image: pd-downloader:latest
    container_name: pd-downloader
    restart: unless-stopped
    ports:
      # NAS 對外開放的 Web 介面連接埠 (http://192.168.50.124:8000)
      - "8000:8000"
    volumes:
      # 自動儲存在專案目錄下的 downloads 資料夾中 (通用相容於任何 NAS 目錄結構)
      - ./downloads:/downloads
    environment:
      - DOWNLOAD_DIR=/downloads
      - TZ=Asia/Taipei
