version: '3.8'

services:
  pd-downloader:
    build: .
    image: pd-downloader:latest
    container_name: pd-downloader
    restart: unless-stopped
    ports:
      # NAS 對外開放的 Web 介面連接埠 (本機埠:容器埠)
      - "8000:8000"
    volumes:
      # 將 NAS 上的下載共享資料夾映射到容器內
      # ASUSTOR 預設常用路徑例如 /volume1/Download/PD-DL 或 ./downloads
      - ./downloads:/downloads
    environment:
      - DOWNLOAD_DIR=/downloads
      - TZ=Asia/Taipei
