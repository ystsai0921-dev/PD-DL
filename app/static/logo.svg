<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 (科技深邃午夜紫藍) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 柔和外光暈邊框 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.6" />
    </linearGradient>

    <!-- 玄鳳冠羽漸層 (明亮金色到檸檬黃) -->
    <linearGradient id="crestGrad1" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="crestGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#fef9c3" />
    </linearGradient>

    <!-- 玄鳳臉部漸層 (溫潤明亮鵝黃) -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- 身體羽毛漸層 (優雅石墨灰) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- 腮紅漸層 (招牌鮮亮橘紅) -->
    <radialGradient id="cheekGrad" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="75%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- 腮紅光暈 -->
    <filter id="cheekGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 鳥喙漸層 -->
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- 眼睛深層光澤 -->
    <radialGradient id="eyeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- 正方形圓角卡片底圖 (App Icon 規格) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- 科技感裝飾光暈圈 -->
  <circle cx="260" cy="270" r="160" fill="#6366f1" opacity="0.08" />

  <!-- === 玄鳳鸚鵡 主體層 === -->
  <g id="cockatiel">
    
    <!-- 後冠羽 (次羽層，帶深度陰影感) -->
    <path d="M 235 180 C 220 130, 240 70, 310 42 C 285 85, 275 130, 260 185 Z" 
          fill="url(#crestGrad2)" opacity="0.9" />

    <!-- 主冠羽 (高聳標誌性飄逸羽冠) -->
    <path d="M 210 190 C 190 115, 220 50, 335 32 C 285 75, 265 130, 245 200 Z" 
          fill="url(#crestGrad1)" />

    <!-- 前小冠羽 (俏皮前傾微卷小毛) -->
    <path d="M 190 205 C 180 155, 205 110, 270 85 C 240 120, 225 155, 218 215 Z" 
          fill="url(#crestGrad1)" />

    <!-- 身體與頸部 (深灰羽毛層) -->
    <path d="M 155 350 C 145 410, 165 470, 200 496 L 390 496 C 410 480, 420 440, 415 380 C 405 320, 340 310, 310 320 Z" 
          fill="url(#bodyGrad)" />

    <!-- 翅膀白色羽斑邊緣 (玄鳳經典特徵) -->
    <path d="M 330 380 C 350 410, 375 450, 395 496 L 415 496 C 420 460, 410 410, 385 370 Z" 
          fill="#f8fafc" opacity="0.9" />

    <!-- 鳥頭與臉部圓潤輪廓 (亮麗鵝黃色) -->
    <path d="M 150 280 C 145 220, 185 180, 255 185 C 330 190, 365 240, 360 310 C 355 375, 305 395, 240 390 C 175 385, 155 340, 150 280 Z" 
          fill="url(#faceGrad)" />

    <!-- 額頭淺黃高光過渡 -->
    <path d="M 180 230 C 200 195, 250 190, 280 205 C 250 215, 205 235, 180 270 Z" 
          fill="#fef9c3" opacity="0.6" />

    <!-- 標誌性大腮紅 (亮橘紅色圓斑) -->
    <circle cx="285" cy="315" r="42" fill="url(#cheekGrad)" filter="url(#cheekGlow)" />
    <!-- 腮紅中心高光點 -->
    <circle cx="275" cy="305" r="14" fill="#ffedd5" opacity="0.3" />

    <!-- 鳥喙 (小巧微勾的可愛嘴部) -->
    <!-- 上喙基部 -->
    <path d="M 148 268 C 120 280, 105 305, 120 335 C 130 325, 142 320, 155 318 C 158 300, 155 282, 148 268 Z" 
          fill="url(#beakGrad)" />
    <!-- 上喙前端彎勾 -->
    <path d="M 120 335 C 112 342, 118 350, 126 342 C 138 330, 148 322, 155 318 Z" 
          fill="#94a3b8" />
    <!-- 鼻瘤 (Cere) 淺色質感 -->
    <ellipse cx="152" cy="272" rx="8" ry="5" fill="#f1f5f9" opacity="0.8" />
    <circle cx="150" cy="273" r="2" fill="#64748b" />

    <!-- 靈動大眼睛 (圓圓黑眼睛) -->
    <!-- 眼眶白邊/裸皮微光 -->
    <circle cx="205" cy="265" r="24" fill="#fef08a" />
    <circle cx="205" cy="265" r="21" fill="#fef9c3" opacity="0.7" />
    <circle cx="205" cy="265" r="18" fill="url(#eyeGrad)" />
    <!-- 眼神高光 (大亮點 + 小亮點) -->
    <circle cx="199" cy="258" r="6" fill="#ffffff" />
    <circle cx="212" cy="270" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- 微笑表情嘴角微線 -->
    <path d="M 148 318 C 160 322, 172 320, 180 316" 
          stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>

  <!-- 底部微科技感弧光 (呼應 Downloader 速度感) -->
  <path d="M 80 430 Q 256 480 432 430" stroke="#6366f1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
